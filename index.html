<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCRISA · Programación de Grupos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ===== colores de marca CCRISA ===== */
  :root{ --azul:#004D8C; --azul-osc:#003566; --naranjo:#D37826; --blanco:#ffffff; }

  /* ---- TEMA A: Corporativo claro ---- */
  body.tema-a{
    --bg:#eef2f7; --hdr:#ffffff; --hdr-txt:var(--azul); --hdr-sub:#5a6b80; --linea-hdr:var(--naranjo);
    --reloj:var(--azul); --chip-bg:#ffffff; --chip-txt:#33465c; --chip-num:var(--naranjo); --chip-borde:#d9e1ec;
    --card:#ffffff; --card-borde:#d6dfeb; --card-h:var(--azul); --card-h-txt:#ffffff; --tag-bg:var(--naranjo); --tag-txt:#ffffff;
    --lbl:var(--naranjo); --txt:#16263a; --txt2:#2f4157; --div:#e3e9f1; --veh-bg:#e6eef8; --veh-txt:var(--azul); --punto:var(--naranjo);
    --num:var(--azul); --nota:#6b7a8c; --pie:var(--azul); --pie-txt:#ffffff; --aviso-bg:var(--naranjo); --aviso-txt:#ffffff; --barra:var(--naranjo); --barra-bg:#d9e1ec;
    --logo-bg:transparent;
  }
  /* ---- TEMA B: Azul noche ---- */
  body.tema-b{
    --bg:#06182e; --hdr:#0a2547; --hdr-txt:#ffffff; --hdr-sub:#9fb4cf; --linea-hdr:var(--naranjo);
    --reloj:var(--naranjo); --chip-bg:#0d2c52; --chip-txt:#c9d7e8; --chip-num:var(--naranjo); --chip-borde:#163a66;
    --card:#0b2343; --card-borde:#173a63; --card-h:#0f3260; --card-h-txt:#ffffff; --tag-bg:var(--naranjo); --tag-txt:#ffffff;
    --lbl:var(--naranjo); --txt:#ffffff; --txt2:#d4e0ee; --div:#173a63; --veh-bg:#14406f; --veh-txt:#ffffff; --punto:var(--naranjo);
    --num:var(--naranjo); --nota:#8fa6c2; --pie:var(--naranjo); --pie-txt:#ffffff; --aviso-bg:var(--azul); --aviso-txt:#ffffff; --barra:var(--naranjo); --barra-bg:#0d2c52;
    --logo-bg:#ffffff;
  }
  /* ---- TEMA C: Panel lateral ---- */
  body.tema-c{
    --bg:#f3f6fa; --hdr:var(--azul); --hdr-txt:#ffffff; --hdr-sub:#bcd3ea; --linea-hdr:var(--naranjo);
    --reloj:#ffffff; --chip-bg:rgba(255,255,255,.08); --chip-txt:#d6e4f3; --chip-num:#ffffff; --chip-borde:rgba(255,255,255,.15);
    --card:#ffffff; --card-borde:#dbe3ee; --card-h:#ffffff; --card-h-txt:var(--azul); --tag-bg:var(--azul); --tag-txt:#ffffff;
    --lbl:var(--naranjo); --txt:#16263a; --txt2:#2f4157; --div:#e3e9f1; --veh-bg:#fdf0e4; --veh-txt:#a3561a; --punto:var(--azul);
    --num:var(--naranjo); --nota:#6b7a8c; --pie:var(--naranjo); --pie-txt:#ffffff; --aviso-bg:var(--azul-osc); --aviso-txt:#ffffff; --barra:var(--naranjo); --barra-bg:#dbe3ee;
    --logo-bg:#ffffff;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
  .mono{font-family:"JetBrains Mono",Consolas,monospace}
  #app{position:fixed;inset:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto;
       grid-template-areas:"h" "r" "g" "p" "f"}

  /* encabezado */
  header{grid-area:h;display:flex;align-items:center;gap:2vw;padding:1.4vh 2vw;background:var(--hdr);border-bottom:.6vh solid var(--linea-hdr);box-shadow:0 .3vh 1vh rgba(0,0,0,.08)}
  .logo{flex:none;height:11vh;padding:.6vh .8vw;border-radius:1vh;background:var(--logo-bg);display:flex;align-items:center}
  .logo img{height:100%;display:block}
  .sep{width:2px;align-self:stretch;margin:.6vh 0;background:var(--div)}
  .titulos{flex:1;min-width:0}
  .titulos h1{font-size:4.8vh;font-weight:700;letter-spacing:.1vw;line-height:1;color:var(--hdr-txt);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titulos p{font-family:Barlow,Arial,sans-serif;font-size:2.1vh;font-weight:600;color:var(--hdr-sub);margin-top:.7vh;text-transform:uppercase;letter-spacing:.12vw;display:flex;gap:1vw;align-items:center;flex-wrap:wrap}
  .alerta{background:#e53935;color:#fff;padding:.2vh .7vw;border-radius:.4vh;font-weight:700;letter-spacing:.06vw}
  /* indicadores económicos junto al reloj */
  .indic{flex:none;display:grid;grid-template-columns:repeat(3,auto);gap:.7vh .45vw}
  .ind{background:#F3F5F9;border:1px solid #e1e7f0;border-left:.35vh solid var(--azul);border-radius:.6vh;padding:.45vh .6vw .5vh;min-width:6.6vw}
  .ind.metal{border-left-color:var(--naranjo)}
  .ind .k{display:flex;justify-content:space-between;align-items:center;gap:.5vw;font-family:Barlow,Arial;font-size:1.2vh;font-weight:700;letter-spacing:.12vw;color:#5a6b80;line-height:1.2}
  .ind .v{font-family:"JetBrains Mono",Consolas,monospace;font-size:2vh;font-weight:700;color:var(--azul);white-space:nowrap;line-height:1.25}
  .ind.metal .v{color:#8a4a12}
  .ind .u{font-family:Barlow,Arial;font-size:1.15vh;font-weight:600;color:#7d8aa0;margin-left:.2vw}
  .ind .var{font-family:"JetBrains Mono",Consolas,monospace;font-size:1.1vh;letter-spacing:0}
  .ind .var.up{color:#1f8a4c} .ind .var.dn{color:#d32f2f}
  .reloj{text-align:right;flex:none}
  .reloj .hora{font-size:7vh;font-weight:700;color:var(--reloj);line-height:1}
  .reloj .fecha{font-family:Barlow,Arial;font-size:2vh;font-weight:600;color:var(--hdr-sub);text-transform:uppercase;letter-spacing:.1vw;margin-top:.4vh}

  /* resumen */
  .resumen{grid-area:r;display:flex;gap:1vw;padding:1.2vh 2vw 0}
  .chip{display:flex;align-items:center;gap:.8vw;padding:.7vh 1.2vw;border-radius:.7vh;background:var(--chip-bg);border:1px solid var(--chip-borde);font-family:Barlow,Arial;font-size:2vh;font-weight:700;letter-spacing:.1vw;color:var(--chip-txt)}
  .chip b{font-family:"JetBrains Mono",Consolas,monospace;font-size:2.8vh;color:var(--chip-num)}
  .pagina{margin-left:auto;align-self:center;font-size:2.2vh;color:var(--nota);letter-spacing:.1vw}
  .chips{display:flex;gap:1vw;flex:none}
  /* aviso importante (desde la pestaña AVISOS de la planilla) */
  #destacado{flex:1;min-width:0;display:none;align-items:center;gap:1vw;padding:.5vh 1.2vw;border-radius:.7vh;background:var(--naranjo);color:#fff;box-shadow:0 .3vh 1vh rgba(211,120,38,.35)}
  #destacado.on{display:flex}
  #destacado .ico{flex:none;width:4vh;height:4vh;border-radius:50%;background:#fff;color:var(--naranjo);display:grid;place-items:center;animation:latido 1.4s infinite}
  #destacado .ico svg{width:2.4vh;height:2.4vh}
  #destacado .tit{flex:none;font-family:Barlow,Arial;font-size:1.7vh;font-weight:700;letter-spacing:.2vw;line-height:1.1;opacity:.95}
  #destacado .tit small{display:block;font-size:1.4vh;opacity:.8}
  #destacado .txt{flex:1;min-width:0;font-size:2.7vh;font-weight:700;text-transform:uppercase;line-height:1.08;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;border-left:2px solid rgba(255,255,255,.5);padding-left:1vw}
  #destacado.cambio .txt{animation:entra .5s ease both}
  .estatico #destacado .txt,.estatico #destacado .ico{animation:none}
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes entra{from{opacity:0;transform:translateY(.8vh)}to{opacity:1;transform:none}}

  /* tarjetas */
  #grupos{grid-area:g;display:flex;gap:1.2vw;padding:1.4vh 2vw;min-height:0}
  .columna{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.5vh;overflow:hidden}
  #grupos.compacto .columna{gap:1vh}
  .card{background:var(--card);border:1px solid var(--card-borde);border-radius:1.1vh;display:flex;flex-direction:column;overflow:hidden;min-height:0;box-shadow:0 .4vh 1.4vh rgba(0,40,90,.08)}
  .card-h{display:flex;align-items:center;gap:1vw;padding:.9vh 1.1vw;background:var(--card-h);color:var(--card-h-txt)}
  .gtag{flex:none;background:var(--tag-bg);color:var(--tag-txt);font-weight:700;font-size:3vh;letter-spacing:.1vw;padding:.25vh .9vw;border-radius:.5vh;text-transform:uppercase}
  .destino{flex:1;min-width:0;display:flex;align-items:center;gap:.5vw;font-size:2.9vh;font-weight:700;text-transform:uppercase;letter-spacing:.05vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .destino svg{flex:none;width:2.5vh;height:2.5vh}
  .card-b{flex:1;display:grid;grid-template-columns:44% 1fr;min-height:0;font-size:var(--f,2.6vh)}
  .col{padding:1vh 1.1vw;overflow:hidden;min-height:0}
  .col + .col{border-left:2px solid var(--div)}
  .lbl{font-family:Barlow,Arial;font-size:.62em;color:var(--lbl);letter-spacing:.18vw;font-weight:700;margin-bottom:.6vh;padding-bottom:.4vh;border-bottom:2px solid var(--div)}

  /* personal en lista ordenada */
  .veh{display:flex;align-items:center;gap:.5vw;margin:.7vh 0 .35vh;padding:.15vh .6vw;width:max-content;border-radius:.4vh;background:var(--veh-bg);color:var(--veh-txt);font-family:"JetBrains Mono",Consolas,monospace;font-size:.72em;font-weight:700}
  .veh svg{width:1.1em;height:1.1em}
  .lista{list-style:none}
  .per{display:grid;grid-template-columns:1.1em 1fr;align-items:center;color:var(--txt2);font-weight:600;line-height:1.25;text-transform:uppercase}
  .per::before{content:"";width:.38em;height:.38em;border-radius:50%;background:var(--punto)}
  .per span{white-space:nowrap;overflow:hidden}

  /* actividades */
  .act{display:grid;grid-template-columns:2.4em 1fr;line-height:1.18;margin-bottom:.5vh;font-weight:600;text-transform:uppercase;color:var(--txt2)}   /* mismo estilo que el personal */
  .act .n{color:var(--num);font-family:"JetBrains Mono",Consolas,monospace;font-size:.82em;padding-top:.12em}
  .act.nota{color:var(--nota);font-weight:600;font-style:italic}
  /* página compacta (grupos chicos juntos): encabezados y márgenes más justos */
  #grupos.compacto{gap:1vh 1.2vw;padding-top:1vh;padding-bottom:1vh}
  #grupos.compacto .card-h{padding:.45vh 1.1vw}
  #grupos.compacto .gtag{font-size:2.5vh}
  #grupos.compacto .destino{font-size:2.4vh}
  #grupos.compacto .col{padding:.6vh 1.1vw}
  #grupos.compacto .lbl{margin-bottom:.3vh;padding-bottom:.2vh}
  #grupos.compacto .veh{margin:.4vh 0 .2vh}
  #destacado .txt{font-size:2.4vh}
  /* pantallas extra (imágenes desde la pestaña PANTALLAS) */
  #pantalla{grid-area:g;display:none;padding:1.4vh 2vw;z-index:2;background:var(--bg);min-height:0}
  #pantalla.on{display:block}
  #pantalla img{display:block;width:100%;height:100%;object-fit:contain;animation:aparece .7s ease both}
  @keyframes aparece{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
  .estatico #pantalla img{animation:none}
  #pantalla .par{display:flex;gap:1.2vw;height:100%;align-items:center;justify-content:center}
  #pantalla .par img{flex:none;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
  #app.con-imagen #grupos{visibility:hidden}
  #app.con-imagen #resumen{display:none}
  #pantalla{position:relative;overflow:hidden}

  /* calendario de lavados (pestaña CRONOGRAMA) */
  .cal{height:100%;overflow:hidden;font-family:Barlow,Arial,sans-serif;font-size:var(--fc,2vh);color:#16263a}
  .cal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1em 1.1em;align-items:start}
  .dcard{background:#fff;border-radius:.7em;overflow:hidden;border-top:.3em solid var(--naranjo);box-shadow:0 .3em 1em rgba(0,40,90,.10)}
  .dcard-h{display:flex;align-items:center;gap:.6em;padding:.45em .8em;background:#0F3D7A;color:#fff}
  .dnum{font-size:2.3em;font-weight:700;line-height:1}
  .dmes{display:flex;flex-direction:column;line-height:1.15}
  .dmes b{font-size:.78em;letter-spacing:.16em;color:#F59A3D}
  .dmes i{font-style:normal;font-size:.66em;letter-spacing:.16em;opacity:.8}
  .dpill{margin-left:auto;font-size:.72em;background:rgba(255,255,255,.16);padding:.2em .75em;border-radius:1em;white-space:nowrap}
  .dbody{padding:.55em .8em .3em}
  .lav{border-left:.22em solid var(--c);padding:.05em 0 .05em .7em;margin:.25em 0 .55em}
  .lav .cl{color:var(--c);font-size:.7em;font-weight:700;letter-spacing:.1em}
  .lav .ac{font-weight:700;font-size:.98em;line-height:1.2}
  .lav .de{color:#6b7a8c;font-size:.76em;line-height:1.25}
  .cal-res{grid-column:span 2;display:flex;flex-direction:column;gap:1em}
  .rcard{background:#fff;border-radius:.7em;border-top:.32em solid #0F3D7A;padding:.8em 1em 1em;box-shadow:0 .3em 1em rgba(0,40,90,.10)}
  .rtit{font-size:.78em;font-weight:700;letter-spacing:.22em;color:#0F3D7A;margin-bottom:.6em}
  .rtiles{display:grid;gap:.7em}
  .rtile{background:#F3F5F9;border-left:.25em solid var(--c);border-radius:.4em;padding:.5em .8em}
  .rtile .cl{color:var(--c);font-size:.72em;font-weight:700;letter-spacing:.1em}
  .rtile .n{font-size:1.9em;font-weight:700;color:#0F3D7A;line-height:1.1}
  .rtile .d{font-size:.74em;color:#6b7a8c}
  .mtile{background:linear-gradient(135deg,#1A5BA8,#0F3D7A);border-radius:.4em;padding:.45em .9em .55em;color:#fff}
  .mtile .n{font-size:1.9em;font-weight:700;line-height:1.15}
  .mtile .l{font-size:.68em;letter-spacing:.16em;opacity:.85}
  .anim-cal .dcard,.anim-cal .rcard{animation:flip .55s cubic-bezier(.2,.8,.3,1) both}
  .vacio{flex:1;display:grid;place-items:center;font-size:4vh;color:var(--nota);text-align:center}

  .anim .card{animation:flip .6s cubic-bezier(.2,.8,.3,1) both;transform-origin:top}
  @keyframes flip{from{transform:rotateX(-90deg);opacity:0}to{transform:none;opacity:1}}

  /* pie */
  .progreso{grid-area:p;height:.5vh;background:var(--barra-bg)}
  .progreso div{height:100%;width:0;background:var(--barra);transition:width .25s linear}
  footer{grid-area:f;display:flex;align-items:center;height:6.2vh;background:var(--pie);color:var(--pie-txt);overflow:hidden}
  .aviso{flex:none;height:100%;display:flex;align-items:center;gap:.6vw;padding:0 1.5vw;background:var(--aviso-bg);color:var(--aviso-txt);font-size:2.6vh;font-weight:700;letter-spacing:.15vw}
  .aviso svg{width:2.6vh;height:2.6vh}
  .cinta{flex:1;overflow:hidden;white-space:nowrap}
  .cinta span{display:inline-block;padding-left:100%;font-size:3vh;font-weight:700;letter-spacing:.06vw;text-transform:uppercase;animation:correr linear infinite}
  @keyframes correr{to{transform:translateX(-100%)}}
  .estatico .cinta span{animation:none;padding-left:1.5vw}
  .actualizado{flex:none;padding:0 1.5vw;font-family:Barlow,Arial;font-size:1.8vh;font-weight:600;opacity:.85}
  .actualizado.error{color:#ffd0d0;opacity:1}

  /* ---- TEMA C: distribución con panel lateral ---- */
  body.tema-c #app{grid-template-columns:20vw 1fr;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"h g" "r g" "p p" "f f"}
  body.tema-c header{flex-direction:column;align-items:stretch;gap:1.6vh;padding:2.4vh 1.3vw 1.6vh;border-bottom:0;border-right:.6vh solid var(--linea-hdr);box-shadow:none}
  body.tema-c .logo{height:auto;padding:1vh .8vw;justify-content:center}
  body.tema-c .logo img{width:100%;height:auto}
  body.tema-c .sep{display:none}
  body.tema-c .titulos h1{white-space:normal;font-size:3.4vh;line-height:1.08}
  body.tema-c .titulos p{font-size:1.7vh}
  body.tema-c .reloj{text-align:left;order:-1;border-bottom:2px solid rgba(255,255,255,.15);padding-bottom:1.4vh}
  body.tema-c .reloj .hora{font-size:8.5vh}
  body.tema-c .reloj .fecha{font-size:1.7vh}
  body.tema-c .resumen{flex-direction:column;justify-content:flex-end;background:var(--hdr);padding:0 1.3vw 2vh;border-right:.6vh solid var(--linea-hdr);gap:.9vh;overflow:hidden}
  body.tema-c .chip{justify-content:space-between;font-size:1.8vh;padding:.5vh 1vw}
  body.tema-c .chip b{font-size:2.5vh}
  body.tema-c .card-b{grid-template-columns:47% 1fr}
  body.tema-c .destino{font-size:2.5vh}
  body.tema-c .pagina{margin:1vh 0 0;color:var(--hdr-sub)}
  body.tema-c #grupos{padding:1.8vh 1.6vw}
  body.tema-c .card{border-top:.6vh solid var(--naranjo)}
  body.tema-c .card-h{border-bottom:2px solid var(--div)}

  /* configuración */
  #setup{position:fixed;inset:0;display:none;place-items:center;background:#06182e;font-family:Arial,sans-serif;padding:16px}
  #setup .caja{max-width:720px;width:100%;background:#0b2343;border-radius:12px;padding:28px;color:#d4e0ee}
  #setup h2{color:var(--naranjo);font-size:28px;margin-bottom:10px}
  #setup ol{margin:12px 0 18px 20px;line-height:1.5}
  #setup input{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #2b4a75;background:#06182e;color:#fff}
  #setup button{margin-top:12px;padding:12px 18px;font-size:16px;font-weight:bold;border:0;border-radius:8px;background:var(--naranjo);color:#fff;cursor:pointer}
  #setup .link{margin-top:16px;word-break:break-all;color:var(--naranjo);font-family:Consolas,monospace}
</style>
</head>
<body>

<script>
(function(){

  const IND = {};

  // el título se achica solo si no cabe (por ejemplo, títulos largos de pantallas extra)
  function ajustarTitulo(){
    const h = $('titulo'); if (!h || !h.clientWidth) return;
    // se mide el texto con la misma letra (Barlow Condensed) en un lienzo: es exacto y no depende del "..."
    const cs = getComputedStyle(h), texto = h.textContent.toUpperCase();
    const ctx = (ajustarTitulo.c = ajustarTitulo.c || document.createElement('canvas')).getContext('2d');
    const esp = parseFloat(cs.letterSpacing) || 0;
    let f = 4.8;
    const ancho = () => {               // tamaño real en píxeles que el navegador aplica al título
      h.style.fontSize = f.toFixed(2) + 'vh';
      ctx.font = cs.fontWeight + ' ' + getComputedStyle(h).fontSize + ' ' + cs.fontFamily;
      return ctx.measureText(texto).width + esp * texto.length;
    };

  /* ---------- lectura de la planilla ---------- */
  function interpretar(filas){
    let titulo = '', g = null, cols = null;
    const grupos = [];
    for (const f of filas) {
      const celdas = f.map(c => String(c||'').trim());
      const iG = celdas.findIndex(c => /^GRUPO\b/.test(norm(c)));
      if (iG >= 0) {
        const iV = celdas.findIndex(c => norm(c).startsWith('VEHICULO'));
        const iA = celdas.findIndex(c => norm(c).startsWith('ACTIVIDAD'));
        cols = { p: iG + 1, v: iV >= 0 ? iV : iG + 2, a: iA >= 0 ? iA : iG + 3 };
        g = { nombre: celdas[iG], destino: celdas[iG+1] || '', personal: [], actividades: [] };
        grupos.push(g);
        continue;
      }
      if (!g) { const t = celdas.find(c => c); if (t && !titulo) titulo = t; continue; }
      const persona = celdas[cols.p] || '', veh = celdas[cols.v] || '';
      const act = celdas.slice(cols.a).filter(Boolean).join(' ');
      if (persona) g.personal.push({ nombre: persona, veh: veh });
      if (act) g.actividades.push(act);
    }
    return { titulo, grupos };
  }

  // Pestaña AVISOS:  A = AVISO (texto) · B = IMPORTANTE (SI = recuadro destacado; vacío = cinta inferior)
  function interpretarAvisos(filas){
    if (!filas || !filas.length || !norm(filas[0][0]).startsWith('AVISO')) return null;  // no existe la pestaña
    return filas.slice(1).map(f => ({ texto: String(f[0]||'').trim(), imp: /^S/.test(norm(f[1])) })).filter(a => a.texto);
  }

  // Pestaña PANTALLAS:  A = IMAGEN (link de Drive) · B = TÍTULO · C = SEGUNDOS · D = MOSTRAR (SI/NO)
  function linkImagen(s){
    s = String(s||'').trim();
    const m = s.match(/\/d\/([\w-]{20,})/) || s.match(/[?&]id=([\w-]{20,})/);
    if (m) return { url: 'https://lh3.googleusercontent.com/d/' + m[1] + '=w1920',
                    respaldo: 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1920' };
    return /^https?:\/\//.test(s) ? { url: s, respaldo: '' } : null;
  }
  function interpretarPantallas(filas){
    if (!filas || !filas.length || !norm(filas[0][0]).startsWith('IMAGEN')) return [];   // no existe la pestaña
    return filas.slice(1).map(f => {
      const l = linkImagen(f[0]);
      const s = parseFloat(String(f[2]||'').replace(',', '.'));
      // columnas E y F (opcionales): segunda y tercera imagen, al lado de la primera
      const extras = [linkImagen(f[4]), linkImagen(f[5])].filter(Boolean);
      return l && { ...l, titulo: String(f[1]||'').trim(), seg: s > 0 ? Math.max(3, s) : null,   // sin segundos: usa los de ORDEN
                    on: !/^N/.test(norm(f[3])), extras };
    }).filter(p => p && p.on);
  }

  /* ---------- pestaña CRONOGRAMA: el cronograma de lavados pegado tal cual desde el Excel ----------
     Filas 1-2: encabezados (FRECUENCIA, CLIENTE, FAENA, TIPO, ACTIVIDAD y, sobre los días, el MES).
     Columnas de días con un "1" = ese día hay lavado. Filas sin CLIENTE (p. ej. "OTROS") se ignoran. */
  const MESES_UP = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  function tipoTitulo(s){   // "PLANTA CERRILLOS" -> "Planta Cerrillos"; respeta siglas como N.A., S/E, N°1, M.P.C.
    return String(s||'').trim().split(/\s+/).map((w, i) => {
      if (/^KV$/i.test(w)) return 'kV';
      if (i > 0 && /^(DE|DEL|LA|LAS|EL|LOS|Y|EN|A)$/i.test(w)) return w.toLowerCase();
      if (/[\d.\/°]/.test(w) && w.length <= 7) return w.toUpperCase();
      return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
    }).join(' ').replace(/ - /g, ' – ');
  }
  function interpretarCronograma(filas){
    const L = (filas && filas.labels) || [], nl = L.map(norm);
    const col = k => nl.findIndex(s => s.includes(k));
    const iC = col('CLIENTE'), iA = col('ACTIVIDAD');
    if (iC < 0 || iA < 0) return null;                       // no existe la pestaña CRONOGRAMA
    const iF = col('FAENA'), iT = col('TIPO'), iQ = col('FRECUENCIA');
    const ultimo = Math.max(iC, iA, iF, iT, iQ);
    const hoy = new Date();
    let mes = -1, previo = 0; const dias = [];
    L.forEach((lab, i) => {
      if (i <= ultimo) return;
      const n = norm(lab), md = n.match(/(\d{1,2})\s*$/);
      if (!md) return;
      const dia = +md[1]; if (dia < 1 || dia > 31) return;
      const m = MESES_UP.findIndex(x => n.includes(x));
      if (m >= 0) mes = m;
      else if (mes < 0) mes = hoy.getMonth();                  // sin nombre de mes: se asume el mes actual
      else if (dia <= previo) mes = (mes + 1) % 12;            // los días vuelven a 1: empieza el mes siguiente
      previo = dia; dias.push({ i, dia, mes });
    });
    const anio = m => { let y = hoy.getFullYear(); if (m - hoy.getMonth() > 6) y--; if (hoy.getMonth() - m > 6) y++; return y; };
    const frec = s => String(s||'').trim().toLowerCase().replace(/\bdias\b/, 'días');
    const lavados = [];
    filas.forEach(f => {
      const cliente = String(f[iC]||'').trim();
      if (!cliente || norm(cliente) === 'CLIENTE') return;
      dias.forEach(d => {
        const v = String(f[d.i]||'').trim();
        if (!v || v === '0') return;
        const fecha = new Date(anio(d.mes), d.mes, d.dia);
        if (fecha.getMonth() !== d.mes) return;                  // p. ej. 31 de noviembre
        lavados.push({ fecha: fecha.toISOString().slice(0,10), cliente: cliente.toUpperCase(),
          actividad: String(f[iA]||'').trim(),
          detalle: [tipoTitulo(iF >= 0 ? f[iF] : ''), tipoTitulo(iT >= 0 ? f[iT] : ''), frec(iQ >= 0 ? f[iQ] : '')].filter(Boolean).join(' · ') });
      });
    });
    return lavados;
  }

  function leerHoja(nombre, filasEncabezado){
    return new Promise((ok, mal) => {
      const cb = '__hoja' + Date.now();
      const s = document.createElement('script');
      const fin = () => { delete window[cb]; s.remove(); clearTimeout(tm); };
      const tm = setTimeout(() => { fin(); mal(new Error('Sin respuesta de Google. Revisa internet y que la planilla esté compartida como "Cualquier persona con el enlace".')); }, 20000);
      window[cb] = resp => {
        fin();
        if (!resp || resp.status === 'error') return mal(new Error('Google respondió con error al leer la planilla'));
        const filas = resp.table.rows.map(r => (r.c || []).map(c => c == null ? '' : String(c.f != null ? c.f : (c.v != null ? c.v : ''))));
        filas.labels = resp.table.cols.map(c => String(c.label || ''));   // títulos de columna (si se piden filas de encabezado)
        ok(filas);
      };
      s.onerror = () => { fin(); mal(new Error('La planilla no está compartida como "Cualquier persona con el enlace"')); };
      s.src = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(ID) + '/gviz/tq?tqx=out:json;responseHandler:' + cb +
              '&headers=' + (filasEncabezado || 0) + (nombre ? '&sheet=' + encodeURIComponent(nombre) : '') + '&_=' + Date.now();
      document.head.appendChild(s);
    });
  }

  /* ---------- pestaña ORDEN: qué se muestra, en qué orden y cuántos segundos ----------
     A = PANTALLA (nombre exacto de una pestaña, o PANTALLAS) · B = SEGUNDOS · C = MOSTRAR (SI/NO)
     - pestaña de programación: SEGUNDOS por cada página de grupos
     - pestaña de cronograma: SEGUNDOS que dura el calendario
     - PANTALLAS: cada imagen activa, una tras otra, con sus propios segundos (si no tiene, usa los de ORDEN) */
  function interpretarOrden(filas){
    if (!filas || !filas.length || !norm(filas[0][0]).startsWith('PANTALLA')) return null;   // no existe ORDEN
    return filas.slice(1).map(f => ({ nombre: String(f[0]||'').trim(), seg: parseFloat(String(f[1]||'').replace(',', '.')) || 0,
                                      on: !/^N/.test(norm(f[2])) }))
                .filter(e => e.nombre && e.on);
  }

  // del cronograma pegado se muestra un mes: el actual si está; si no, el último mes que aparezca
  function seccionCalendario(lav, seg, nombre){
    const h = new Date(), actual = h.getFullYear() + '-' + p2(h.getMonth() + 1);
    const meses = [...new Set(lav.map(l => l.fecha.slice(0, 7)))].sort();
    const clave = meses.includes(actual) ? actual : meses[meses.length - 1];
    const m = +clave.slice(5) - 1, a = +clave.slice(0, 4);
    return { tipo: 'cal', nombre, seg, lav: lav.filter(l => l.fecha.startsWith(clave)), actual: clave === actual,
             titulo: 'LAVADO DE AISLACIÓN · ' + MESES_UP[m] + ' ' + a };
  }

  async function cargar(){
    const d = { secciones: [] };
    if (DEMO) {
      d.avisos = interpretarAvisos([['AVISO','IMPORTANTE'],
        ['Corte programado de energía en bodega mañana de 08:00 a 10:00 hrs','SI'],
        ['Recordar realizar la confección de documentación para cada faena y entregarla al Departamento de Prevención de Riesgos',''],
        ['Reunión de seguridad el viernes 08:00 hrs','']]);
      const p = interpretar(demoFilas());
      d.secciones.push({ tipo: 'prog', nombre: 'DEMO', seg: SEGUNDOS_POR_PAGINA, titulo: p.titulo, grupos: p.grupos });
      d.secciones.push(seccionCalendario(interpretarCronograma(demoCronograma()), SEGUNDOS_CALENDARIO, 'CRONOGRAMA'));
      return d;
    }
    const previa = n => datos && datos.secciones.find(s => s.nombre === n);   // si falla una lectura, se usa lo último
    try { d.avisos = interpretarAvisos(await leerHoja('AVISOS')); } catch (e) { d.avisos = datos ? datos.avisos : null; }
    let imgs = [];
    try { imgs = interpretarPantallas(await leerHoja('PANTALLAS')); } catch (e) { const p = previa('PANTALLAS'); imgs = p ? p.items : []; }
    let orden = null;
    try { orden = interpretarOrden(await leerHoja('ORDEN')); } catch (e) { orden = datos ? datos.orden : null; }
    d.orden = orden;
    // sin pestaña ORDEN: programación (primera pestaña) → CRONOGRAMA (si existe) → imágenes
    const lista = orden || [{ nombre: HOJA, seg: SEGUNDOS_POR_PAGINA }, { nombre: 'CRONOGRAMA', seg: SEGUNDOS_CALENDARIO, soloCrono: true },
                            { nombre: 'PANTALLAS', seg: 15 }];
    for (const e of lista) {
      if (norm(e.nombre) === 'PANTALLAS') {
        const items = imgs.map(p => ({ ...p, seg: p.seg || e.seg || 15 }));
        if (items.length) d.secciones.push({ tipo: 'imgs', nombre: 'PANTALLAS', seg: e.seg || 15, items });
        continue;
      }
      try {
        const filas = await leerHoja(e.nombre);
        const p = interpretar(filas);
        if (p.grupos.length && !e.soloCrono) {
          d.secciones.push({ tipo: 'prog', nombre: e.nombre, seg: e.seg || SEGUNDOS_POR_PAGINA, titulo: p.titulo, grupos: p.grupos });
          continue;
        }
        const lav = interpretarCronograma(await leerHoja(e.nombre, 2));
        if (lav && lav.length) d.secciones.push(seccionCalendario(lav, e.seg || SEGUNDOS_CALENDARIO, e.nombre));
      } catch (err) {
        const p = previa(e.nombre); if (p) d.secciones.push(p);
      }
    }
    return d;
  }

  /* ---------- páginas y tamaño de los cuadros ----------
     Los grupos se reparten en 2 columnas que siempre llenan toda la pantalla (sin espacios vacíos).
     Cada cuadro recibe un alto proporcional a su contenido: más gente/actividades = cuadro más alto.
     La letra se agranda lo más posible sin que nada se corte.
     Se juntan más de 4 grupos en una página solo si caben con letra legible (grupos chicos);
     si no, quedan 4 por página y van rotando. */
  const LETRA_MIN_JUNTOS = 2.2;    // vh: letra mínima para juntar más de 4 grupos en una página
  const LETRA_MAX = 3.0, LETRA_MIN = 1.4;
  const ESCALA_LETRA_GRUPOS = 0.9;   // 1 = lo más grande posible · 0.9 = un poco más chica
  const MAX_POR_PAGINA = 8;

  function montar(items){

    cont.innerHTML = '<div class="columna"></div><div class="columna"></div>';
    const cols = [...cont.children];
    const tmp = document.createElement('div'); tmp.innerHTML = items.map(tarjeta).join('');
    const cards = [...tmp.children];
    cards.forEach(c => { c.style.flex = 'none'; c.querySelector('.card-b').style.setProperty('--f', '2.4vh'); cols[0].appendChild(c); });
    const h = cards.map(c => c.offsetHeight);
    if (cards.length === 1) cols[1].remove();
    else {   // reparte en orden, cada cuadro a la columna que va más corta
      const alto = [0, 0];
      cards.forEach((c, i) => { const k = alto[0] <= alto[1] ? 0 : 1; cols[k].appendChild(c); alto[k] += h[i]; });
    }
    return { cols: [...cont.children], cards };
  }

  function ajustarPagina(cols, cards){
    const setF = f => cards.forEach(c => c.querySelector('.card-b').style.setProperty('--f', f.toFixed(2) + 'vh'));
    const cabe = () => cols.every(c => c.scrollHeight <= c.clientHeight + 1);
    cards.forEach(c => c.style.flex = 'none');
    let lo = LETRA_MIN, hi = LETRA_MAX;
    setF(hi);
    if (cabe()) lo = hi;
    else for (let i = 0; i < 10; i++) { const m = (lo + hi) / 2; setF(m); if (cabe()) lo = m; else hi = m; }
    lo = Math.max(LETRA_MIN, lo * ESCALA_LETRA_GRUPOS);   // un punto más chica que el máximo que cabe
    setF(lo);
    // el espacio que sobra se reparte: cada cuadro crece en proporción a su contenido
    const nat = cards.map(c => c.offsetHeight);
    cards.forEach((c, i) => c.style.flex = `${nat[i]} 1 0px`);
    nombres(cards);
    return lo;
  }

  function calcularPaginas(){
    const gs = prog ? prog.grupos : []; paginas = [];
    let i = 0;
    while (i < gs.length) {
      const resto = gs.length - i;
      let k = 0;
      for (let n = Math.min(resto, MAX_POR_PAGINA); n > GRUPOS_POR_PAGINA; n--) {
        const m = montar(gs.slice(i, i + n));
        if (ajustarPagina(m.cols, m.cards) >= LETRA_MIN_JUNTOS - 0.01) { k = n; break; }
      }
      if (!k) k = Math.min(resto, GRUPOS_POR_PAGINA);
      paginas.push({ desde: i, hasta: i + k }); i += k;
    }
    if (!paginas.length) paginas = [{ desde: 0, hasta: 0 }];
  }

  function ajustar(){   // re-ajuste periódico de la página visible (p. ej. cuando terminan de cargar las letras)
    const cont = $('grupos');
    const cards = [...cont.querySelectorAll('.card')];
    if (cards.length) ajustarPagina([...cont.querySelectorAll('.columna')], cards);
  }

  // nombres: mismo tamaño para toda la lista de cada grupo (el que necesite el nombre más largo)
  function nombres(cards){
    cards.forEach(card => {
      const pers = [...card.querySelectorAll('.per')];
      const fija = e => pers.forEach(p => p.style.fontSize = e.toFixed(2) + 'em');
      const sobra = () => pers.some(p => { const s = p.querySelector('span'); return s.scrollWidth > s.clientWidth + 1; });
      let e = 1; fija(e);
      while (sobra() && e > 0.6) { e -= 0.03; fija(e); }
    });
  }

  function fechaDelTitulo(t){
    const m = String(t).match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
    if (!m) return null; let y = +m[3]; if (y < 100) y += 2000;
    return new Date(y, m[2]-1, +m[1]);
  }

  function encabezadoProgramacion(){
    $('titulo').textContent = prog.titulo || 'Programación de trabajos';
    const f = fechaDelTitulo(prog.titulo), hoy = new Date(); hoy.setHours(0,0,0,0);
    const dif = f ? Math.round((f - hoy) / 86400000) : 0;
    const etiqueta = dif === 1 ? ' <span class="alerta" style="background:var(--azul)">PROGRAMACIÓN DE MAÑANA</span>'
                   : dif !== 0 ? ' <span class="alerta">⚠ ESTA PROGRAMACIÓN NO ES DE HOY</span>' : '';
    $('subtitulo').innerHTML = esc(SUBTITULO) + etiqueta;
    ajustarTitulo();
  }

  function precargar(){
    datos.secciones.filter(s => s.tipo === 'imgs').forEach(s => s.items.forEach(p => {
      [p.url, ...(p.extras || []).map(e => e.url)].filter(Boolean).forEach(u => { const i = new Image(); i.src = u; });
    }));
  }

  /* ---------- calendario de lavados (mismo diseño de la imagen aprobada) ---------- */
  const COLORES_CLIENTE = { 'NUEVA ATACAMA': '#1F5FBF', 'COEMIN': '#E07B20', 'PUCOBRE': '#2E8B57' };
  const PALETA_EXTRA = ['#7B4FC4', '#C2185B', '#00838F', '#6D4C41', '#5C6BC0', '#9E9D24'];
  function colorCliente(c, orden){ return COLORES_CLIENTE[c] || PALETA_EXTRA[orden.indexOf(c) % PALETA_EXTRA.length]; }
  const DIAS_UP = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];

  function htmlCalendario(lav){
    const clientes = [...new Set(lav.map(l => l.cliente))];
    const extra = clientes.filter(c => !COLORES_CLIENTE[c]);
    const porDia = {};
    lav.forEach(l => (porDia[l.fecha] = porDia[l.fecha] || []).push(l));
    const fechas = Object.keys(porDia).sort();
    const tarjetas = fechas.map(f => {
      const d = new Date(f + 'T12:00:00'), items = porDia[f];
      return `<div class="dcard">
        <div class="dcard-h"><span class="dnum">${p2(d.getDate())}</span>
          <span class="dmes"><b>${MESES_UP[d.getMonth()]}</b><i>${DIAS_UP[d.getDay()]}</i></span>
          <span class="dpill">${items.length} ${items.length === 1 ? 'lavado' : 'lavados'}</span></div>
        <div class="dbody">${items.map(l => `<div class="lav" style="--c:${colorCliente(l.cliente, extra)}">
          <div class="cl">${esc(l.cliente)}</div><div class="ac">${esc(l.actividad)}</div><div class="de">${esc(l.detalle)}</div></div>`).join('')}</div>
      </div>`;
    }).join('');
    const resCli = clientes.map(c => {
      const dd = [...new Set(lav.filter(l => l.cliente === c).map(l => +l.fecha.slice(8)))].sort((a, b) => a - b);
      const n = lav.filter(l => l.cliente === c).length;
      return `<div class="rtile" style="--c:${colorCliente(c, extra)}"><div class="cl">${esc(c)}</div><div class="n">${n}</div>
        <div class="d">${n === 1 ? 'lavado' : 'lavados'} · ${dd.length === 1 ? 'día' : 'días'} ${dd.join(', ')}</div></div>`;
    }).join('');
    const kpi = (n, t) => `<div class="mtile"><div class="n">${n}</div><div class="l">${t}</div></div>`;
    return `<div class="cal"><div class="cal-grid">${tarjetas}
      <div class="cal-res">
        <div class="rcard"><div class="rtit">RESUMEN POR CLIENTE</div><div class="rtiles" style="grid-template-columns:repeat(${Math.min(clientes.length, 4)},1fr)">${resCli}</div></div>
        <div class="rcard"><div class="rtit">RESUMEN DEL MES</div><div class="rtiles" style="grid-template-columns:repeat(3,1fr)">
          ${kpi(lav.length, 'LAVADOS')}${kpi(fechas.length, 'DÍAS CON FAENA')}${kpi(clientes.length, 'CLIENTES')}</div></div>
      </div></div></div>`;
  }

  function ajustarCalendario(){       // letra lo más grande posible sin que nada se corte
    const cal = document.querySelector('#pantalla .cal');
    if (!cal) return;
    const grid = cal.firstElementChild;
    const cabe = () => grid.offsetHeight <= cal.clientHeight - 10 && grid.scrollWidth <= cal.clientWidth + 1;   // deja un margen abajo
    let lo = 0.8, hi = 3.2;
    for (let i = 0; i < 12; i++) { const m = (lo + hi) / 2; cal.style.setProperty('--fc', m + 'vh'); if (cabe()) lo = m; else hi = m; }
    cal.style.setProperty('--fc', lo + 'vh');
  }

  /* ---------- rotación según la pestaña ORDEN ---------- */
  const seccionActual = () => datos && datos.secciones[sec];

  function abrirPantalla(){ $('pantalla').className = 'on'; $('app').classList.add('con-imagen'); vista = 'img'; }
  function cerrarPantalla(){ $('pantalla').className = ''; $('pantalla').innerHTML = ''; $('app').classList.remove('con-imagen'); vista = 'prog'; }

  function pintarCalendario(s){
    $('titulo').textContent = s.titulo; ajustarTitulo();
    $('subtitulo').innerHTML = 'Programa de mantenimiento' +
      (s.actual ? '' : ' <span class="alerta">⚠ ESTE CALENDARIO NO ES DEL MES ACTUAL</span>');
    $('pantalla').innerHTML = htmlCalendario(s.lav);
    abrirPantalla();
    ajustarCalendario();
  }

  function pintarImagen(p){
    $('titulo').textContent = p.titulo || 'Información'; ajustarTitulo();
    $('subtitulo').textContent = 'Información para el personal';
    const extras = (p.extras || []).slice();
    if (qs.get('img2prueba')) extras[0] = { url: qs.get('img2prueba'), respaldo: '' };   // solo para vistas previas
    if (qs.get('img3prueba')) extras[1] = { url: qs.get('img3prueba'), respaldo: '' };
    if (extras.filter(Boolean).length) { pintarVarias(p, extras.filter(Boolean)); return; }
    const img = new Image();
    img.alt = p.titulo;
    let respaldo = false;
    img.onerror = () => {               // si no carga: probar el enlace de respaldo; si tampoco, pasar a lo siguiente
      if (!respaldo && p.respaldo) { respaldo = true; img.src = p.respaldo; }
      else if (img.isConnected) { t0 = performance.now(); avanzar(); }
    };
    img.src = qs.get('imgprueba') || p.url;              // ?imgprueba=... solo para vistas previas
    $('pantalla').innerHTML = ''; $('pantalla').appendChild(img);
    abrirPantalla();
  }

  // 2 o 3 imágenes lado a lado: cada una recibe un ancho proporcional a su forma, así todas quedan del mismo alto
  // Orden en pantalla, de izquierda a derecha: F (IMAGEN 3) · E (IMAGEN 2) · A (IMAGEN)
  function pintarVarias(p, extras){
    const par = document.createElement('div'); par.className = 'par';
    const lista = [...extras.map(e => [e.url, e.respaldo])].reverse().concat([[qs.get('imgprueba') || p.url, p.respaldo]]);
    let listas = 0, fallas = 0;
    const terminado = () => { if (++listas === lista.length) acomodarVarias(); };
    lista.forEach(([u, resp]) => {
      const img = new Image(); let r = false;
      img.alt = p.titulo;
      img.onload = terminado;
      img.onerror = () => {
        if (!r && resp) { r = true; img.src = resp; return; }
        img.remove(); fallas++;
        if (fallas === lista.length) { if (par.isConnected) { t0 = performance.now(); avanzar(); } } else terminado();
      };
      img.src = u; par.appendChild(img);
    });
    $('pantalla').innerHTML = ''; $('pantalla').appendChild(par);
    abrirPantalla();
  }

  // todas del mismo alto, lo más grandes posible, juntas y centradas (sin deformar ni recortar)
  function acomodarVarias(){
    const par = document.querySelector('#pantalla .par'); if (!par) return;
    const imgs = [...par.querySelectorAll('img')].filter(i => i.naturalWidth);
    if (!imgs.length) return;
    const sep = parseFloat(getComputedStyle(par).columnGap) || 0;
    const W = par.clientWidth - sep * (imgs.length - 1), H = par.clientHeight;
    const suma = imgs.reduce((s, i) => s + i.naturalWidth / i.naturalHeight, 0);
    const alto = Math.min(H, W / suma);
    imgs.forEach(i => { i.style.height = alto + 'px'; i.style.width = (alto * i.naturalWidth / i.naturalHeight) + 'px'; });
  }

  function mostrarSeccion(i, animar){
    const S = datos.secciones;
    if (!S.length) { cerrarPantalla(); $('grupos').innerHTML = '<div class="vacio">No hay pantallas activas en ORDEN</div>'; return; }
    sec = ((i % S.length) + S.length) % S.length; sub = 0; t0 = performance.now();
    const s = S[sec];
    if (s.tipo === 'prog') { prog = s; cerrarPantalla(); pagina = 0; dibujar(animar, true); }
    else if (s.tipo === 'cal') pintarCalendario(s);
    else pintarImagen(s.items[0]);
  }

  function duracion(){
    const s = seccionActual(); if (!s) return SEGUNDOS_POR_PAGINA;
    return s.tipo === 'imgs' ? (s.items[sub] || {}).seg || s.seg : s.seg;
  }

  function hayRotacion(){
    const S = datos ? datos.secciones : [], s = seccionActual();
    return S.length > 1 || (s && s.tipo === 'prog' && paginas.length > 1) || (s && s.tipo === 'imgs' && s.items.length > 1);
  }

  function avanzar(){
    const s = seccionActual(); if (!s) return;
    if (s.tipo === 'prog' && pagina < paginas.length - 1) { pagina++; dibujar(true); return; }
    if (s.tipo === 'imgs' && sub < s.items.length - 1) { sub++; pintarImagen(s.items[sub]); return; }
    mostrarSeccion(sec + 1, true);
  }

  // datos nuevos de la planilla: se actualiza lo que se está viendo sin perder el lugar en la rotación
  function actualizarSeccionActual(){
    const s = seccionActual();
    if (!s) { mostrarSeccion(0, false); return; }
    if (s.tipo === 'prog' && vista === 'prog') { prog = s; dibujar(false, true); }
    else if (s.tipo === 'cal') pintarCalendario(s);
    else if (s.tipo === 'imgs' && sub < s.items.length && vista === 'img') { /* la imagen visible sigue igual */ }
    else mostrarSeccion(sec, false);
  }

  function dibujar(animar, recalcular){
    if (!prog) return;
    const gs = prog.grupos;
    if (recalcular || !paginas.length) calcularPaginas();
    const total = paginas.length;
    if (pagina >= total) pagina = 0;
    if (vista === 'prog') encabezadoProgramacion();
    const personas = gs.reduce((s,g) => s + g.personal.length, 0);
    const vehiculos = new Set(gs.flatMap(g => g.personal.map(p => p.veh).filter(Boolean))).size;
    const acts = gs.reduce((s,g) => s + g.actividades.filter(a => /^\d/.test(a)).length, 0);
    $('resumen').innerHTML =
      `<div class="chip">GRUPOS <b>${gs.length}</b></div><div class="chip">PERSONAS <b>${personas}</b></div>` +
      `<div class="chip">VEHÍCULOS <b>${vehiculos}</b></div><div class="chip">ACTIVIDADES <b>${acts}</b></div>` +
      (total > 1 ? `<div class="pagina mono">PÁGINA ${pagina+1} / ${total}</div>` : '');
    const cont = $('grupos');
    if (!gs.length) { cont.innerHTML = '<div class="vacio">Sin grupos programados</div>'; return; }
    const p = paginas[pagina];
    const m = montar(gs.slice(p.desde, p.hasta));
    ajustarPagina(m.cols, m.cards);
    if (animar) { void cont.offsetWidth; cont.classList.add('anim'); m.cards.forEach((el,k) => el.style.animationDelay = (k*120) + 'ms'); }
  }

  function estado(ok, txt){ const el = $('actualizado'); el.classList.toggle('error', !ok); el.textContent = txt; }

  async function refrescar(){
    try {
      const nuevo = await cargar();
      const cambio = !datos || JSON.stringify(nuevo) !== JSON.stringify(datos);
      const primera = !datos;
      datos = nuevo;
      aplicarAvisos(nuevo.avisos);                 // primero los avisos: el recuadro cambia el espacio disponible
      if (primera) {
        mostrarSeccion(parseInt(qs.get('sec')) || 0, !ESTATICO);              // ?sec=N&sub=M solo para pruebas
        const s = seccionActual();
        if (qs.has('sub') && s && s.tipo === 'imgs' && s.items[+qs.get('sub')]) { sub = +qs.get('sub'); pintarImagen(s.items[sub]); }
      }
      else if (cambio) actualizarSeccionActual();
      if (cambio) precargar();
      const d = new Date(); estado(true, 'Actualizado ' + p2(d.getHours()) + ':' + p2(d.getMinutes()));
    } catch (e) {
      if (!datos) $('grupos').innerHTML = '<div class="vacio"><div>No se pudo leer la planilla.<br><small style="font-size:.6em">' + esc(e.message) + '</small></div></div>';
      estado(false, '⚠ Sin conexión — mostrando último dato');
    }
  }

  /* ---------- avisos: cinta inferior + recuadro importante ---------- */
  const ICO_MEGA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  let importantes = [], iImp = 0;
  function ponerCinta(lista){
    const msg = lista.join('     ◆     ');
    if ($('mensaje').textContent === msg) return;          // sin cambios: no reiniciar el movimiento
    $('mensaje').textContent = msg;
    $('mensaje').style.animationDuration = Math.max(15, msg.length * SEG_POR_LETRA) + 's';
  }
  function mostrarImportante(){
    const el = $('destacado');
    if (!importantes.length) { el.className = ''; el.innerHTML = ''; return; }
    if (iImp >= importantes.length) iImp = 0;
    const tot = importantes.length > 1 ? `<small>${iImp+1} de ${importantes.length}</small>` : '';
    el.innerHTML = `<div class="ico">${ICO_MEGA}</div><div class="tit">AVISO<br>IMPORTANTE${tot}</div><div class="txt">${esc(importantes[iImp])}</div>`;
    el.className = 'on cambio';
  }
  function aplicarAvisos(av){
    const cinta = av ? av.filter(a => !a.imp).map(a => a.texto) : [];
    ponerCinta(cinta.length ? cinta : AVISOS);              // sin pestaña AVISOS: usa los avisos de AJUSTES
    const nuevos = av ? av.filter(a => a.imp).map(a => a.texto) : [];
    if (JSON.stringify(nuevos) !== JSON.stringify(importantes)) { importantes = nuevos; iImp = 0; mostrarImportante(); }
  }
  setInterval(() => { if (importantes.length > 1) { iImp++; mostrarImportante(); } }, 8000);
  ponerCinta(AVISOS);
  window.addEventListener('resize', () => { ajustarTitulo(); if (datos && vista === 'prog') dibujar(false, true); else if (vista === 'img') { ajustarCalendario(); acomodarVarias(); } });
  if (document.fonts) document.fonts.ready.then(() => { ajustarTitulo(); if (datos && vista === 'prog') dibujar(false, true); else ajustarCalendario(); });   // al cargar las letras, recalcula
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { ajustarTitulo(); if (datos && vista === 'prog') ajustar(); });
  setInterval(() => { ajustarTitulo(); if (datos && vista === 'prog') ajustar(); }, 5000);

  // reloj de rotación (temporizador simple: funciona igual en TV, PC y navegadores en segundo plano)
  setInterval(() => {
    const now = performance.now();
    if (ESTATICO) return;                // modo captura: sin rotación
    if (datos && hayRotacion()) {
      const r = Math.min(1, (now - t0) / (duracion()*1000));
      $('barra').style.width = (r*100) + '%';
      if (r >= 1) { t0 = now; avanzar(); }
    } else { $('barra').style.width = '0'; t0 = now; }
  }, 250);

  refrescar();
  setInterval(refrescar, 60000);
  setTimeout(() => location.reload(), 6 * 3600000);
})();
</script>
</body>
